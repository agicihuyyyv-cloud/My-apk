name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: unzip -o DuitkuAndroid-v2.zip
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.9
          arguments: assembleDebug
          build-root-directory: DuitkuAndroid
      - uses: actions/upload-artifact@v4
        with:
          name: Duitku-APK
          path: DuitkuAndroid/app/build/outputs/apk/debug/*.apk
