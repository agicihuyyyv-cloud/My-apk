name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf DuitkuAndroid
          unzip -o DuitkuAndroid-v2.zip
          ls -la
          cat DuitkuAndroid/.github/workflows/build-apk.yml
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: |
          cd DuitkuAndroid
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Duitku-APK
          path: DuitkuAndroid/app/build/outputs/apk/debug/*.apk
